<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#1d232b; --muted:#6b7480; --soft:#8a929c; --line:#eceef1;
          --ok:#2e9e4f; --info:#9aa3ad; --idle:#2f7fd8; --nodata:var(--info); --warn:#e0a100; --bad:#d6342c; --crit:var(--bad); --problem:#e0529c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121519; --card:#1b1f25; --fg:#e4e8ec; --muted:#98a1ab; --soft:#7c858f; --line:#2a3038;
          --info:#7c858f; --idle:#4b95e8; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:10px 16px 12px; background:var(--bg); color:var(--fg); font:12px/1.4 "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
  button { font-family:inherit; }
  @keyframes pulse { 50% { opacity:.55; } }
  @keyframes blink { 50% { filter:brightness(.4) saturate(.6); box-shadow:inset 0 2px 6px rgba(0,0,0,.6); } }
  /* ------------------------------------------------ the control panel header: steel plate, readouts, pilot lamps */
  .panel { position:relative; margin-bottom:12px; padding:10px 20px 12px; border-radius:10px; color:#e3e7eb;
           background:linear-gradient(180deg, #474d55 0%, #353a41 45%, #2b2f35 100%);
           border:1px solid #1a1d21; box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.25); }
  .panel .screw { position:absolute; width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #c9ced4, #6d737b 70%);
                  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35); }
  .panel .screw::after { content:""; position:absolute; left:1px; right:1px; top:4px; height:1px; background:rgba(0,0,0,.45); transform:rotate(35deg); }
  .panel .screw.tl { top:7px; left:7px; } .panel .screw.tr { top:7px; right:7px; } .panel .screw.bl { bottom:7px; left:7px; } .panel .screw.br { bottom:7px; right:7px; }
  .panel header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .panel h1 { margin:0; font-size:13px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:#f1f3f5;
              padding:4px 12px; border-radius:3px; background:#1c1f23; border:1px solid #0f1113; box-shadow:inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.08); }
  .readout { font-size:12px; font-weight:600; letter-spacing:.06em; color:#8dff8a; text-shadow:0 0 6px rgba(141,255,138,.45);
             padding:3px 10px; border-radius:3px; background:#070908; border:1px solid #000; box-shadow:inset 0 1px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); }
  .panel nav { margin-left:auto; display:flex; gap:8px; }
  .panel nav a, .panel nav button { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#e3e7eb; text-decoration:none; cursor:pointer;
             padding:4px 10px; border-radius:4px; border:1px solid #16191c; background:linear-gradient(180deg, #5a616a, #3c4148);
             box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(0,0,0,.4); }
  .panel nav a:hover, .panel nav button:hover { background:linear-gradient(180deg, #666e78, #454b53); }
  .panel nav a:active, .panel nav button:active { box-shadow:inset 0 2px 3px rgba(0,0,0,.5); transform:translateY(1px); }
  /* the alarm message display */
  #summary { display:flex; align-items:center; gap:12px; padding:8px 14px; border-radius:4px; font-size:13px; font-weight:600; letter-spacing:.02em;
             background:#070908; border:1px solid #000; box-shadow:inset 0 2px 5px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); color:#9aa3ad; }
  #summary::before { content:"■"; font-size:11px; }
  #summary .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #summary .counts { font-size:11px; font-weight:600; white-space:nowrap; opacity:.85; }
  #summary.ok, #summary.info, #summary.idle { color:#8dff8a; text-shadow:0 0 6px rgba(141,255,138,.4); }
  #summary.notice { color:#6fb6ff; text-shadow:0 0 6px rgba(111,182,255,.45); }
  #summary.problem { color:#ff7cc0; text-shadow:0 0 6px rgba(255,124,192,.45); }
  #summary.warn { color:#ffc23a; text-shadow:0 0 6px rgba(255,194,58,.45); }
  #summary.bad, #summary.critical { color:#ff5a4d; text-shadow:0 0 7px rgba(255,90,77,.55); animation:pulse 2s ease-in-out infinite; }
  #summary.critical { background:#2a0705; }
  #summary.stale { color:#9aa3ad; text-shadow:none; }
  /* not current (no connection, or the server not gathering): every lamp and dot grey, so no colour is read as now */
  body.stale .dot, body.stale .big, body.stale .bar i { filter:grayscale(1); opacity:.45; }
  body.stale .row .main { text-decoration:line-through; text-decoration-color:rgba(154,163,173,.6); }
  /* the pilot lamps */
  #overview { display:flex; flex-wrap:wrap; gap:10px 26px; justify-content:center; margin-top:10px; }
  #overview a { display:flex; flex-direction:column; align-items:center; gap:9px; text-decoration:none; width:104px; text-align:center; }
  #overview .bezel { width:46px; height:46px; border-radius:50%; padding:4px;
                     background:conic-gradient(from 210deg, #f2f4f6, #8e959d, #e1e4e8, #6c737b, #f2f4f6);
                     box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.35); transition:transform .12s; }
  #overview a:hover .bezel { transform:scale(1.05); }
  #overview .big { --lamp:#4b5057; width:100%; height:100%; border-radius:50%;
                   background:
                              radial-gradient(circle at 50% 60%, var(--lamp) 0 55%, color-mix(in srgb, var(--lamp) 60%, #000) 100%);
                   box-shadow:inset 0 -3px 6px rgba(0,0,0,.45), 0 0 16px 2px color-mix(in srgb, var(--lamp) 70%, transparent); }
  #overview .big.ok { --lamp:#36d158; } #overview .big.notice { --lamp:#3d8cf0; } #overview .big.problem { --lamp:#ff5fae; } #overview .big.warn { --lamp:#ffb81f; }
  #overview .big.bad, #overview .big.critical { --lamp:#ff3b2f; animation:blink 2s ease-in-out infinite; }
  #overview .big.info, #overview .big.idle, #overview .big.nodata { --lamp:#5d636b; box-shadow:inset 0 -3px 6px rgba(0,0,0,.5); }   /* unlit */
  #overview .bezel:has(.critical) { box-shadow:0 0 0 4px rgba(255,59,47,.45), 0 2px 4px rgba(0,0,0,.55); }
  #overview span { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; line-height:1.25; color:#eef1f4;
                   padding:3px 7px; border-radius:2px; background:#1c1f23; border:1px solid #0f1113; box-shadow:inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.07); }
  @media (max-width: 480px) { #overview .bezel { width:54px; height:54px; padding:5px; } #overview a { width:80px; } .panel { padding:12px 14px 16px; } }
  /* the cards */
  /* three fixed columns (COLUMNS below): Cherenkov | DAQ over Trackers | Online analysis over PLC over ROS;
     one column, in that order, on a narrow window */
  .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); column-gap:12px; align-items:start; }
  .grid .col { min-width:0; } .grid .col .card { display:block; }
  @media (max-width: 1100px) { .grid { display:block; } }
  .card { container-type:inline-size; break-inside:avoid; display:inline-block; width:100%; margin:0 0 12px; background:var(--card); border-radius:10px; padding:9px 12px 5px; min-width:0; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--line); }
  .card.dragging { opacity:.4; } .card.drop { outline:2px dashed var(--soft); outline-offset:2px; }
  .card.flash { outline:3px solid var(--idle); outline-offset:2px; }
  .card h2 { font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 6px;
             display:flex; gap:8px; align-items:center; user-select:none; }
  .card h2 .grip { margin-left:auto; color:var(--soft); letter-spacing:-2px; opacity:0; transition:opacity .15s; }
  .card:hover h2 .grip { opacity:1; }
  .row { display:grid; grid-template-columns:10px minmax(0, 170px) minmax(0, 1fr) auto auto; gap:8px; align-items:start; padding:2px 2px; border-top:1px solid var(--line); cursor:pointer; border-radius:4px; }
  .rows .row:first-child { border-top:none; }
  .row.dragging { opacity:.35; }
  .row:hover { background:color-mix(in srgb, var(--line) 55%, transparent); }
  .name { font-weight:550; overflow-wrap:anywhere; min-width:0; } .text { color:var(--muted); overflow-wrap:anywhere; min-width:0; }
  .text .main { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }   /* long texts: two lines; all of it when opened */
  .row.open .text .main { display:block; -webkit-line-clamp:unset; }
  .age { grid-column:5; grid-row:1; color:var(--soft); font-size:11px; white-space:nowrap; }
  .trend { grid-column:4; grid-row:1; display:grid; grid-template-columns:repeat(3, 4.5ch 8ch); justify-content:start; column-gap:4px; font-size:12px; color:var(--muted); line-height:inherit; padding-top:1px; font-variant-numeric:tabular-nums; }
  @container (max-width: 640px) { .trend { grid-column:2 / -1; grid-row:auto; margin-top:-2px; padding-top:0; } }   /* a narrow card: the changes on their own line */
  .trend i { font-style:normal; } .trend b { font-weight:500; text-align:right; padding-right:1ch; }   /* right-aligned in its slot: the digits stay put as the sign comes and goes */
  .dot { width:10px; height:10px; border-radius:50%; margin-top:4px; background:var(--nodata); }
  .dot.ok { background:var(--ok); } .dot.info { background:var(--info); } .dot.idle { background:var(--info); } .dot.notice { background:var(--idle); } .dot.problem { background:var(--problem); } .dot.warn { background:var(--warn); }
  .dot.bad { background:var(--bad); animation:pulse 2s ease-in-out infinite; } .dot.critical { background:var(--crit); animation:pulse 2s ease-in-out infinite; box-shadow:0 0 0 3px color-mix(in srgb, var(--crit) 30%, transparent); }
  .row .dot.warn ~ .text, .row .dot.bad ~ .text, .row .dot.critical ~ .text { color:var(--fg); }
  .bar { grid-column:3 / -1; position:relative; height:6px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:2px; }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--ok); }
  .bar i.notice { background:var(--idle); } .bar i.problem { background:var(--problem); } .bar i.warn { background:var(--warn); } .bar i.bad { background:var(--bad); animation:pulse 2s ease-in-out infinite; }
  .bar b { position:absolute; top:0; bottom:0; width:2px; background:var(--card); }
  .details { grid-column:2 / -1; font:11px/1.4 ui-monospace, monospace; color:var(--muted); background:color-mix(in srgb, var(--line) 50%, transparent);
             border-radius:6px; padding:8px 10px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:320px; overflow:auto; cursor:text; }
  .mode { font-size:10px; font-weight:600; text-transform:none; letter-spacing:0; border-radius:10px; padding:1px 8px; color:var(--muted); background:var(--line); }
  footer { margin-top:4px; color:var(--soft); font-size:10.5px; line-height:1.5; }
  footer i { display:inline-block; width:8px; height:8px; border-radius:50%; margin:0 4px 0 10px; vertical-align:0; }
  /* ------------------------------------------------ the skin selector: a three-position panel switch */
  .skins { display:inline-flex; margin-right:6px; padding:2px; border-radius:5px; background:#0d0f11; border:1px solid #000;
           box-shadow:inset 0 2px 4px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.08); }
  .skins label { cursor:pointer; }
  .sizer { display:inline-flex; align-items:center; gap:6px; margin-right:6px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#8d959e; }
  .sizer input { width:110px; accent-color:#ff7a1a; cursor:pointer; }
  .sizer .sizenum { width:4.2em; cursor:text; font:inherit; letter-spacing:normal; text-align:right; font-variant-numeric:tabular-nums;
                   background:transparent; color:inherit; border:1px solid currentColor; border-radius:3px; padding:0 2px; accent-color:auto; }
  .panel nav .sizer button.on { color:#ff9a3c; }
  body.minimal .sizer { color:var(--soft); }
  body.minimal .panel nav .sizer button.on { color:var(--fg); text-decoration:underline; }
  .skins input { position:absolute; opacity:0; width:0; height:0; }
  .skins span { display:block; padding:3px 9px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#8d959e; }
  .skins input:checked + span { color:#1d2126; background:linear-gradient(180deg, #e9ecef, #a6adb5); box-shadow:0 1px 2px rgba(0,0,0,.6); }
  .skins input:focus-visible + span { outline:2px solid #ff7a1a; outline-offset:1px; }

/* ------------------------------------------------ the console skin: a modern control panel. Machined dark metal,
   raised keycaps with a lit strip, engraved label plates, recessed screens; one accent colour (--acc), no scanlines.
   Graphite and amber; the colours are the variables on body.console. */
  body.console { --bg:var(--r-bg); --card:var(--r-screen); --fg:var(--r-ink); --muted:var(--r-ink2); --soft:var(--r-ink3); --line:var(--r-rule);
               --ok:#39e07a; --info:#5b6b73; --idle:#3fa9ff; --warn:#ffb000; --bad:#ff3d2e;
               background:radial-gradient(ellipse at 50% -20%, var(--r-bg-hi) 0%, var(--r-bg) 60%) fixed; }
  body.console::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:50;   /* a soft vignette only */
                      background:radial-gradient(ellipse at center, transparent 65%, rgba(0,0,0,.35) 100%); }
  body.console .panel { background:linear-gradient(180deg, var(--r-metal-hi) 0%, var(--r-metal) 45%, var(--r-metal-lo) 100%);
                      border:1px solid #000; border-radius:14px; color:var(--r-panel-ink, var(--r-ink));
                      box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 0 rgba(0,0,0,.45), 0 0 0 3px var(--r-frame), 0 0 0 4px rgba(255,255,255,.06), 0 12px 28px rgba(0,0,0,.7); }
  body.console .panel::before { content:""; position:absolute; left:18px; right:18px; top:0; height:2px; border-radius:0 0 2px 2px;   /* one thin lit edge */
                              background:linear-gradient(90deg, transparent, var(--acc) 20%, var(--acc) 80%, transparent); opacity:.55; box-shadow:0 0 10px var(--acc); }
  body.console .panel .screw { background:radial-gradient(circle at 35% 35%, #d9dde2, #4a5058 70%); box-shadow:inset 0 0 0 1px rgba(0,0,0,.6); }
  body.console .panel h1 { background:#07090b; color:var(--acc); border:1px solid #000; border-radius:6px; letter-spacing:.24em;
                         text-shadow:0 0 8px color-mix(in srgb, var(--acc) 55%, transparent);
                         box-shadow:inset 0 2px 4px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); }
  body.console .readout { color:var(--acc); background:#07090b; border-radius:6px; text-shadow:0 0 8px color-mix(in srgb, var(--acc) 60%, transparent);
                        box-shadow:inset 0 2px 4px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); }
  /* keycaps: raised, with a lit strip under the label; pressed when on */
  body.console .panel nav a, body.console .panel nav button {
    background:linear-gradient(180deg, var(--r-key-hi), var(--r-key)); color:var(--r-key-ink); border:1px solid #000; border-radius:5px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 -3px 0 color-mix(in srgb, var(--acc) 70%, #000), 0 2px 0 #000, 0 3px 6px rgba(0,0,0,.5); }
  body.console .panel nav a:hover, body.console .panel nav button:hover { background:linear-gradient(180deg, color-mix(in srgb, var(--r-key-hi) 85%, #fff), var(--r-key-hi)); }
  body.console .panel nav a:active, body.console .panel nav button:active { transform:translateY(1px); box-shadow:inset 0 1px 3px rgba(0,0,0,.7), inset 0 -2px 0 var(--acc), 0 1px 0 #000; }
  body.console .skins { background:#07090b; box-shadow:inset 0 2px 4px rgba(0,0,0,.9); }
  body.console .skins span { color:var(--r-ink3); }
  body.console .skins input:checked + span { background:linear-gradient(180deg, var(--r-key-hi), var(--r-key)); color:var(--acc);
                                           box-shadow:inset 0 -2px 0 var(--acc), 0 1px 0 #000; text-shadow:0 0 6px color-mix(in srgb, var(--acc) 60%, transparent); }
  body.console .sizer { color:var(--r-panel-ink2, var(--r-ink2)); } body.console .sizer input { accent-color:var(--acc); }
  body.console .panel nav .sizer button.on { color:var(--acc); }
  body.console #summary { background:#050708; border-radius:8px; border:1px solid #000;
                        box-shadow:inset 0 0 16px color-mix(in srgb, var(--acc) 10%, transparent), inset 0 2px 6px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.07); }
  /* pilot lamps: machined rings, engraved plates */
  body.console #overview .bezel { background:conic-gradient(from 210deg, #c9ced4, #3d434a, #9aa1a9, #2a2f35, #c9ced4); box-shadow:0 0 0 2px #000, 0 3px 6px rgba(0,0,0,.6); }
  /* the raytraced lamps (img/, render_lamps.py), once all have loaded: each image is the lamp and the panel around
     it, with its light falling on the panel; it reaches past the bezel and fades into the page's own panel */
  body.console.lamps-img #overview .bezel { position:relative; width:54px; height:54px; padding:0; background:none; box-shadow:none; }
  body.console.lamps-img #overview .big { position:absolute; left:50%; top:50%; width:170%; height:170%; transform:translate(-50%, -50%);
      border-radius:0; box-shadow:none; background-color:transparent; background-position:center; background-size:100% 100%; background-repeat:no-repeat;
      -webkit-mask-image:radial-gradient(circle closest-side, #000 64%, transparent 100%); mask-image:radial-gradient(circle closest-side, #000 64%, transparent 100%); }
  body.console.lamps-img #overview .bezel:has(.critical)::after { content:""; position:absolute; inset:-4px; border-radius:50%;   /* act now: the ring, over the image */
      box-shadow:0 0 0 4px rgba(255,59,47,.45); pointer-events:none; }
  body.console.lamps-img #overview span { position:relative; z-index:1; }   /* the label plates over the faded edge */
  body.console.lamps-img #overview .big.bad, body.console.lamps-img #overview .big.critical { animation-name:blinkimg; }   /* no inset shadow on the square image */
  @keyframes blinkimg { 50% { filter:brightness(.45) saturate(.7); } }
  /* the cards' dots (each line's, each card title's) as the same lamps, housing and all, the housing the size of
     the dot it replaces: the image is 3.4 bezel radii across (render_lamps.py FRAME), so 170% of the dot; masked
     to the housing, so the panel plate around the lamp does not show on the card */
  body.console.lamps-img .dot.lamp { position:relative; background:none; box-shadow:none; animation:none; }
  body.console.lamps-img .dot.lamp::before { content:""; position:absolute; left:50%; top:50%; width:170%; height:170%; transform:translate(-50%, -50%);
      background:var(--lampimg) center / 100% 100% no-repeat;
      -webkit-mask-image:radial-gradient(circle closest-side, #000 56%, transparent 60%); mask-image:radial-gradient(circle closest-side, #000 56%, transparent 60%); }
  body.console.lamps-img .dot.lamp.bad::before, body.console.lamps-img .dot.lamp.critical::before { animation:blinkimg 2s ease-in-out infinite; }
  body.console.lamps-img .dot.lamp.critical { box-shadow:0 0 0 3px rgba(255,59,47,.45); }   /* act now: the ring, as on the big lamps */
  body.console #overview span { background:#0b0d10; color:var(--r-ink); border:1px solid #000; border-radius:3px; letter-spacing:.12em;
                              box-shadow:inset 0 1px 2px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); }
  /* screens: recessed in the metal */
  /* a card stands off the page: a face a little lighter than the page, a lit top edge, a brighter bezel ring */
  body.console .card { border-radius:12px; padding:12px 16px 8px; background:linear-gradient(180deg, var(--r-screen-hi), var(--r-screen));
                     box-shadow:inset 0 0 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 1px rgba(255,255,255,.05),
                                0 0 0 4px var(--r-frame), 0 0 0 5px rgba(255,255,255,.11), 0 8px 18px rgba(0,0,0,.6); }
  body.console .card h2 { color:var(--acc); letter-spacing:.16em; text-shadow:0 0 8px color-mix(in srgb, var(--acc) 45%, transparent); }
  body.console .name { color:var(--r-ink); }
  body.console .text { color:var(--r-ink2); }
  body.console .trend { color:var(--r-ink3); }
  body.console .row { border-top-color:var(--r-rule); }
  body.console .row:hover { background:color-mix(in srgb, var(--acc) 6%, transparent); }
  body.console .dot { box-shadow:0 0 7px currentColor; }
  body.console .dot.ok { box-shadow:0 0 7px #39e07a; } body.console .dot.notice { box-shadow:0 0 7px #3fa9ff; } body.console .dot.problem { box-shadow:0 0 7px #ff5fae; } body.console .dot.idle { box-shadow:none; }
  body.console .dot.warn { box-shadow:0 0 8px #ffb000; } body.console .dot.bad { box-shadow:0 0 10px #ff3d2e; }
  body.console .dot.info, body.console .dot.nodata { box-shadow:none; }
  body.console .details { background:rgba(0,0,0,.4); color:var(--r-ink2); border:1px solid var(--r-rule); }
  body.console .mode { background:#07090b; color:var(--acc); }
  body.console .bar { background:var(--r-rule); } body.console .bar b { background:var(--r-screen); }
  body.console footer { color:var(--r-ink3); }
  body.console .grid { column-gap:22px; padding:0 6px; } body.console .card { margin-bottom:20px; } body.console .panel { margin:0 6px 20px; }
  body.console { --acc:#ffb000; --r-bg:#0b0d10; --r-bg-hi:#1c2229; --r-metal-hi:#3a4048; --r-metal:#2a2f35; --r-metal-lo:#1d2126; --r-frame:#0e1013; --r-key-hi:#3b4148; --r-key:#262b31; --r-key-ink:#e8ecf0; --r-screen-hi:#161d23; --r-screen:#0f1418; --r-ink:#e9eef2; --r-ink2:#aeb9c2; --r-ink3:#6f7b85; --r-rule:#1c252b; }
  /* ------------------------------------------------ the minimal skin: just the facts */
  body.minimal { --bg:#fff; --card:#fff; --fg:#111; --muted:#555; --soft:#999; --line:#eee; background:#fff; }
  @media (prefers-color-scheme: dark) { body.minimal { --bg:#000; --card:#000; --fg:#eee; --muted:#aaa; --soft:#666; --line:#1a1a1a; background:#000; } }
  body.minimal .panel { background:none; border:none; box-shadow:none; color:var(--fg); padding:0 0 12px; border-radius:0; border-bottom:1px solid var(--line); }
  body.minimal .panel .screw { display:none; }
  body.minimal .panel h1 { background:none; border:none; box-shadow:none; padding:0; color:var(--fg); font-weight:700; letter-spacing:.1em; }
  body.minimal .readout { background:none; border:none; box-shadow:none; padding:0; color:var(--soft); text-shadow:none; font-weight:400; }
  body.minimal .panel nav a, body.minimal .panel nav button { background:none; border:none; box-shadow:none; padding:0 0 0 10px; color:var(--soft); }
  body.minimal .panel nav a:hover, body.minimal .panel nav button:hover { background:none; color:var(--fg); }
  body.minimal .skins { background:none; border:none; box-shadow:none; padding:0; }
  body.minimal .skins span { padding:0 6px; color:var(--soft); }
  body.minimal .skins input:checked + span { background:none; box-shadow:none; color:var(--fg); text-decoration:underline; }
  body.minimal #summary { background:none; border:none; box-shadow:none; padding:4px 0; font-weight:500; color:var(--fg); text-shadow:none; animation:none; }
  body.minimal #summary::before { content:none; }
  body.minimal #summary.notice .t { color:var(--idle); } body.minimal #summary.problem .t { color:var(--problem); } body.minimal #summary.warn .t { color:var(--warn); } body.minimal #summary.bad .t, body.minimal #summary.critical .t { color:var(--bad); }
  body.minimal #summary.critical { background:none; }
  body.minimal #overview { justify-content:flex-start; gap:6px 18px; margin-top:8px; }
  body.minimal #overview a { flex-direction:row; width:auto; gap:6px; }
  body.minimal #overview .bezel { width:10px; height:10px; padding:0; background:none; box-shadow:none; }
  body.minimal #overview a:hover .bezel { transform:none; }
  body.minimal #overview .big { background:var(--lamp); box-shadow:none; }
  body.minimal #overview .big.info, body.minimal #overview .big.idle, body.minimal #overview .big.nodata { --lamp:var(--info); } body.minimal #overview .big.notice { --lamp:var(--idle); } body.minimal #overview .big.problem { --lamp:var(--problem); }
  body.minimal #overview .bezel:has(.critical) { box-shadow:0 0 0 2px var(--bad); border-radius:50%; }
  body.minimal #overview span { background:none; border:none; box-shadow:none; padding:0; color:var(--muted); font-weight:500; letter-spacing:0; text-transform:none; font-size:12px; }
  body.minimal .grid { column-gap:32px; } body.minimal .card { margin-bottom:0; }
  body.minimal .card { background:none; box-shadow:none; border-radius:0; padding:14px 0 6px; }
  body.minimal .card h2 { letter-spacing:.05em; }
  body.minimal .row { border-top:none; padding:2px 0; }
  body.minimal .row:hover { background:none; }
  body.minimal .details { background:none; border-left:2px solid var(--line); border-radius:0; }
  body.minimal .bar { height:2px; } body.minimal .mode { background:none; padding:0; }
  body.minimal footer { border-top:1px solid var(--line); padding-top:8px; }
</style>
</head>
<body>
<section class="panel"><i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
  <header><h1>Experiment status</h1><span class="readout" id="updated">--:--:--</span>
    <nav><span class="skins" title="Skin (kept in this browser)"><label><input type="radio" name="skin" value="panel"><span>Panel</span></label><label><input type="radio" name="skin" value="console"><span>Console</span></label><label><input type="radio" name="skin" value="minimal"><span>Minimal</span></label></span>
      <span class="sizer" title="Size (kept in this browser). Fit: as large as still fits the window."><span>Size</span><input type="range" id="size" min="0.7" max="2.2" step="0.05"><input type="number" class="sizenum" id="sizeval" min="70" max="220" step="1" title="type a size in %, then Enter">%<button id="sizefit">Fit</button></span>
      <a href="/limits" target="_blank">Limits</a><button id="reset" title="Put the lines in each card back in their original order">Reset lines</button></nav></header>
  <div id="summary"><span class="t">connecting…</span></div>
  <div id="overview"></div>
</section>
<div class="grid" id="grid"></div>
<footer><i style="background:var(--ok);margin-left:0"></i>as it should be<i style="background:var(--info)"></i>a plain fact, not running, or no data<i style="background:var(--idle)"></i>to read<i style="background:var(--problem)"></i>data problem (not safety)<i style="background:var(--warn)"></i>safety warning<i style="background:var(--bad)"></i>safety alarm (flashing; a ring: act now)<br>
Click a line for the rest of it; drag a line within its card to move it. Read-only.</footer>
<script>
const ORDER = ['Cherenkov', 'DAQ', 'Trackers', 'Online analysis', 'PLC', 'ROS'];   // the lamps and the cards, always in this order
const COLUMNS = [['Cherenkov'], ['DAQ', 'Trackers'], ['Online analysis', 'PLC', 'ROS']];   // the cards: left to right, each top to bottom
const colOf = g => { const i = COLUMNS.findIndex(c => c.includes(g)); return i < 0 ? COLUMNS.length - 1 : i; };   // any other card: right
const RANK = {info:0, idle:0, ok:1, nodata:2, notice:3, problem:4, warn:5, bad:6, critical:7};   // yellow, red: safety only; pink: a data problem; blue: to read
const KEY = 'status-card-order', ROWKEY = 'status-row-order';   // ROWKEY: group -> line names in the order dragged to
const esc = t => String(t ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k,d){ try { const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); } catch(e){ return d; } },
                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const open = new Set();   // the lines whose details are shown, by group/name
const grid = document.getElementById('grid'), cards = {};   // group -> its card element
const cols = COLUMNS.map(() => { const d = document.createElement('div'); d.className = 'col'; grid.appendChild(d); return d; });
let last = null, lastOK = null, dragging = null, dragRow = null;   // the card, or the line, being dragged
function ago(s){ if(s==null) return ''; if(s<90) return s.toFixed(0)+' s'; if(s<5400) return (s/60).toFixed(0)+' min'; return (s/3600).toFixed(1)+' h'; }
function detailText(d){ return Object.entries(d||{}).map(([k,v]) => k + ': ' + (typeof v==='object' && v!==null ? JSON.stringify(v, null, 1) : v)).join('\n'); }
function order(groups){   // always the lamps' order: ORDER first, anything else after, by name
  return groups.slice().sort((a,b)=>{ const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
}
function cardFor(g){
  if(cards[g]) return cards[g];
  const c = document.createElement('div'); c.className = 'card'; c.dataset.group = g;
  c.innerHTML = '<h2><span class="dot"></span><span class="title"></span><span class="m"></span></h2><div class="rows"></div>';   // cards stay in the lamps' order
  return (cards[g] = c);
}
// a dot as a raytraced lamp (Console skin, once the lamps have loaded): ' lamp" style="..."', closing the class
// attribute it is put at the end of; else nothing. The variant follows the name, so a line keeps its lamp.
function lampDot(level, name){
  if(!(document.body.classList.contains('console') && LAMPS_READY)) return '';
  let h = 0; for(const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return ` lamp" style="--lampimg:url(img/lamp_${LAMP_OF[level] || 'off'}_${h % 3}.png)`;
}
// change over 10 s, 1 min, 10 min in fixed columns, so they line up from line to line
const trendHTML = t => Array.isArray(t) && t.length ? `<small class="trend">${t.map(([k, v])=>`<i>${esc(k)}</i><b>${esc(v)}</b>`).join('')}</small>` : '';
function rowHTML(g, it){
  const key = g + '/' + it.name;
  let bar = '';
  if(it.bar){ const u = Math.max(0, Math.min(1, it.bar.used));
    bar = `<div class="bar" title="${(100*u).toFixed(1)} % used"><i class="${it.level}" style="width:${(100*u).toFixed(2)}%"></i>` +
          (it.bar.marks||[]).filter(m=>m>0 && m<1).map(m=>`<b style="left:${(100*m).toFixed(2)}%"></b>`).join('') + '</div>'; }
  return `<div class="row${open.has(key) ? ' open' : ''}" draggable="true" data-key="${esc(key)}" data-name="${esc(it.name)}"><span class="dot ${it.level}${lampDot(it.level, it.name)}" title="${it.level}"></span><span class="name">${esc(it.name)}</span>` +
         `<span class="text"><span class="main" title="${esc(it.text)}">${esc(it.text)}</span></span><span class="age">${it.age_s!=null && it.age_s>5 ? ago(it.age_s)+' old' : ''}</span>` + trendHTML(it.trend) + bar +
         (open.has(key) ? `<div class="details">${esc(detailText(it.details)) || '(nothing more)'}</div>` : '') + '</div>';
}
function render(S){
  const sm = document.getElementById('summary');
  const noConn = lastOK && (Date.now()-lastOK > 8000);
  // the server answers but has not gathered for a while (a gathering that fails keeps the last one): not current either
  const notGathered = S.error || (S.updated && S.server_time && S.server_time - S.updated > Math.max(10, 4 * (S.interval || 2)));
  const stale = noConn || notGathered;
  document.body.classList.toggle('stale', !!stale);
  sm.className = stale ? 'stale' : S.summary.level;
  const c = S.summary.counts || {};
  const when = S.updated ? new Date(S.updated*1000).toLocaleTimeString([], {hour12:false}) : '–';
  const say = (noConn ? `NO CONNECTION to the status server since ${new Date(lastOK).toLocaleTimeString()} — shown as it was then. ` :
               notGathered ? `NOT CURRENT: the status server has not gathered since ${when}${S.error ? ' (' + S.error + ')' : ''} — shown as it was then. ` : '') + S.summary.text;
  sm.innerHTML = `<span class="t" title="${esc(say)}">${esc(say)}</span>` +
    `<span class="counts">${['critical','bad','warn','problem','notice'].filter(k=>c[k]).map(k=>c[k]+' '+({critical:'act now', bad:'safety alarm', warn:'safety warning', problem:'data problem', notice:'to read'})[k]).join(' · ')}</span>`;
  document.getElementById('updated').textContent = S.updated ? new Date(S.updated*1000).toLocaleTimeString([], {hour12:false}) : '--:--:--';
  if(dragging || dragRow) return;   // nothing moves under the mouse while a card or a line is being dragged
  const groups = {};
  for(const it of S.items) (groups[it.group] = groups[it.group] || []).push(it);
  const names = order(Object.keys(groups)), modes = S.modes || {};
  const worstOf = g => groups[g].reduce((w,x)=>RANK[x.level]>RANK[w]?x.level:w, groups[g][0].level);
  // the big picture: one big circle per card, always in the fixed ORDER (dragging the cards does not move them)
  const fixed = Object.keys(groups).sort((a,b)=>{ const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b); });
  const lampImg = document.body.classList.contains('console') && LAMPS_READY;
  document.getElementById('overview').innerHTML = fixed.map((g, i) =>
    `<a href="#" data-go="${esc(g)}" title="${esc(g)}: ${worstOf(g)}"><div class="bezel"><div class="big ${worstOf(g)}"` +
    (lampImg ? ` style="background-image:url(img/lamp_${LAMP_OF[worstOf(g)] || 'off'}_${i % 3}.png)"` : '') +   // neighbours: other variants
    `></div></div><span>${esc(g)}</span></a>`).join('');
  for(const g of Object.keys(cards)) if(!groups[g]){ cards[g].remove(); delete cards[g]; }
  names.forEach((g, i)=>{
    const card = cardFor(g), its = groups[g];
    const worst = its.reduce((w,x)=>RANK[x.level]>RANK[w]?x.level:w, its[0].level);
    card.querySelector('h2 .dot').outerHTML = `<span class="dot ${worst}${lampDot(worst, g)}"></span>`;
    card.querySelector('h2 .title').textContent = g;
    card.querySelector('h2 .m').innerHTML = g==='Cherenkov' && modes.cherenkov ? `<span class="mode">mode: ${esc(modes.cherenkov.value)}</span>` : '';
    const saved = (store.get(ROWKEY, {})[g] || []);   // the lines in the order dragged to, new ones after
    const pos = it => { const i = saved.indexOf(it.name); return i < 0 ? 1e6 + its.indexOf(it) : i; };
    card.querySelector('.rows').innerHTML = its.slice().sort((a, b)=>pos(a) - pos(b)).map(it=>rowHTML(g, it)).join('');
    const col = cols[colOf(g)], k = names.filter(x => colOf(x) === colOf(g)).indexOf(g);   // names is in ORDER
    if(col.children[k] !== card) col.insertBefore(card, col.children[k] || null);
  });
}
grid.addEventListener('click', ev=>{
  const r = ev.target.closest('.row'); if(!r || ev.target.closest('.details')) return;
  const k = r.dataset.key; open.has(k) ? open.delete(k) : open.add(k); if(last) render(last);
});
document.getElementById('overview').addEventListener('click', ev=>{   // a big circle: to its card
  const a = ev.target.closest('[data-go]'); if(!a) return; ev.preventDefault();
  const c = cards[a.dataset.go]; if(!c) return;
  c.scrollIntoView({behavior:'smooth', block:'center'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'), 1200);
});
// lines move within their card: drag one onto another
grid.addEventListener('dragstart', e=>{
  const r = e.target.closest && e.target.closest('.row'); if(!r || e.target.closest('h2')) return;
  dragRow = r; r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', r.dataset.name);
  e.stopPropagation();
});
grid.addEventListener('dragover', e=>{
  if(!dragRow) return;
  const r = e.target.closest('.row');
  if(!r || r===dragRow || r.parentElement!==dragRow.parentElement) return;   // only within the same card
  e.preventDefault();
  const kids = [...r.parentElement.children];
  r.parentElement.insertBefore(dragRow, kids.indexOf(dragRow) < kids.indexOf(r) ? r.nextSibling : r);
});
grid.addEventListener('dragend', e=>{
  if(!dragRow) return;
  const box = dragRow.parentElement, g = box.closest('.card').dataset.group, all = store.get(ROWKEY, {});
  all[g] = [...box.children].map(x=>x.dataset.name); store.set(ROWKEY, all);
  dragRow.classList.remove('dragging'); dragRow = null; if(last) render(last);
});
// the Console skin's raytraced lamps: three variants per state (real lamps are not all alike); used once all
// have loaded, so a missing one never leaves a lamp blank (the drawn lamps stay)
const LAMP_OF = {ok:'ok', notice:'notice', problem:'problem', warn:'warn', bad:'bad', critical:'bad', info:'off', idle:'off', nodata:'off'};
let LAMPS_READY = false;
{ const files = ['ok', 'notice', 'problem', 'warn', 'bad', 'off'].flatMap(s => [0, 1, 2].map(v => `img/lamp_${s}_${v}.png`));
  let n = 0;
  files.forEach(f => { const im = new Image();
    im.onload = () => { if(++n === files.length){ LAMPS_READY = true; document.body.classList.add('lamps-img'); if(last) render(last); } };
    im.src = f; }); }
// the skin switch, kept in this browser
const SKINS = ['panel', 'console', 'minimal'];
function setSkin(s){
  if(s === 'retro') s = 'console';   // its old name (1 Nov 2026): bookmarks and saved choices keep working
  s = SKINS.includes(s) ? s : 'panel';
  document.body.classList.toggle('console', s === 'console'); document.body.classList.toggle('minimal', s === 'minimal');
  document.querySelectorAll('.skins input').forEach(x=>{ x.checked = x.value === s; });
  store.set('status-skin', s);
  if(typeof last !== 'undefined' && last) render(last);   // the lamps: images in Console, drawn otherwise
}
{ const q = new URLSearchParams(location.search).get('skin');   // ?skin=panel / console / minimal sets it (a bookmark)
  setSkin(q || store.get('status-skin', 'panel') || 'panel'); }
document.querySelectorAll('.skins input').forEach(x=>{ x.onchange = ()=>setSkin(x.value); });
document.getElementById('reset').onclick = ()=>{ store.set(ROWKEY, {}); if(last) render(last); };
// fill the screen: the largest zoom (text, lamps and spacing together) at which the page still fits the window,
// at least 1 (then it scrolls); found again when the window changes, when it no longer fits, and each minute.
// The size slider sets a zoom of its own instead (kept in this browser); Fit goes back to fitting.
let zoom = 1, lastFit = 0, manual = store.get('status-size', null);
const sizeIn = document.getElementById('size'), sizeVal = document.getElementById('sizeval'), sizeFit = document.getElementById('sizefit');
function showSize(z){ sizeIn.value = z; if(document.activeElement !== sizeVal) sizeVal.value = Math.round(z * 100); sizeFit.classList.toggle('on', manual == null); }
const fits = () => document.documentElement.scrollHeight <= innerHeight + 1;
function fit(){
  if(manual != null){ zoom = manual; document.body.style.zoom = zoom; lastFit = Date.now(); showSize(zoom); return; }
  let lo = 1, hi = 2.2;
  document.body.style.zoom = hi;
  if(fits()) lo = hi;
  else for(let k = 0; k < 8; k++){ const m = (lo + hi) / 2; document.body.style.zoom = m; if(fits()) lo = m; else hi = m; }
  zoom = Math.floor(lo * 100) / 100; document.body.style.zoom = zoom; lastFit = Date.now(); showSize(zoom);
}
sizeIn.oninput = ()=>{ sizeVal.value = Math.round(sizeIn.value * 100); };                  // applied on release: the
sizeIn.onchange = ()=>{ manual = +sizeIn.value; store.set('status-size', manual); fit(); };  // slider grows with the page
// or typed (in %): applied on Enter or leaving the box; kept within 70-220 %, anything else puts the size back
sizeVal.onchange = ()=>{
  const v = parseFloat(sizeVal.value);
  if(!isFinite(v) || v <= 0){ sizeVal.value = Math.round(zoom * 100); return; }
  manual = Math.min(2.2, Math.max(0.7, v / 100)); store.set('status-size', manual); sizeVal.blur(); fit(); };
sizeFit.onclick = ()=>{ manual = null; store.set('status-size', null); fit(); };
let rf; addEventListener('resize', ()=>{ clearTimeout(rf); rf = setTimeout(fit, 150); });
async function tick(){
  try { const r = await fetch('/api/status', {cache:'no-store', signal:AbortSignal.timeout(5000)}); if(r.ok){ last = await r.json(); lastOK = Date.now(); } } catch(e){}
  if(last){
    render(last);
    if(manual == null && !document.querySelector('.row.open') && (!fits() && zoom > 1 || Date.now() - lastFit > 60000) || !lastFit) fit();   // an opened line may scroll
  }
}
tick(); setInterval(tick, 2000);
document.fonts && document.fonts.ready.then(()=>{ if(last) fit(); });
</script>
</body>
</html>
